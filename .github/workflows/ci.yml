# Checks for ProManage NZ.
#
# This repository is the deploy root — GitHub Pages serves whatever lands on
# main, immediately, with no build step in between. There is no test suite to
# fall back on, so these two jobs are the only thing standing between a typo
# and a blank app for every installed client.
#
# Both jobs are runnable locally, exactly as they run here:
#   node scripts/check-app.mjs
#   node scripts/smoke-test.mjs

name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The cache-bump check diffs against the base branch, so it needs
          # more than the default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # On a pull request, also assert that touching a shell file came with a
      # CACHE_NAME bump — installed clients keep serving the old shell forever
      # otherwise. There is no base to diff against on a plain push.
      #
      # No extra `git fetch` here: checkout above already ran with
      # fetch-depth: 0, which fetches full history for every branch, not just
      # the one being checked out — origin/<base_ref> is already a local
      # remote-tracking ref by this point. A `git fetch --depth=0` was tried
      # here once; it's invalid syntax (git rejects a depth below 1 with
      # "fatal: depth 0 is not a positive number") and was also redundant, so
      # it silently failed this job on every pull_request-triggered run.
      - name: Run checks
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            node scripts/check-app.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-app.mjs
          fi

  smoke:
    name: boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No package.json in the repo, and deliberately so — install without
      # writing one.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Boot the app in a real browser
        run: node scripts/smoke-test.mjs

      # Runs against the real functions in the real page — see the header of
      # scripts/test.mjs for why the runner is browser-based.
      - name: Run the test suite
        run: node scripts/test.mjs
