# Keeps the Supabase project awake.
#
# Projects on the Free plan pause after 7 consecutive days of inactivity. A
# property manager who opens the app weekly is exactly that usage pattern, and
# a paused project fails every sync with no indication of why. It is restorable
# within 90 days, but the downtime arrives unannounced.
#
# THIS JOB PAUSED THE PROJECT ONCE BY NOT PREVENTING IT. Read this before
# "simplifying" the sign-in below.
#
# The original version pinged `properties?select=id&limit=1` with nothing but
# the publishable key. That authenticates as `anon`, owner-scoped RLS matches
# no rows, and PostgREST answers `200 []`. The job went green twice a week for
# a month and the project paused anyway, on 2026-09-11-ish: the last green ping
# was Thu 2026-09-10 22:36 UTC and DNS was already withdrawn by Mon 2026-09-14
# 23:09 UTC — under four days, far short of the seven-day window. The pings
# proved the project was *reachable*; they never counted as *activity*, so the
# pause clock ran uninterrupted from the last real sign-in in the app.
#
# What resets that clock is a password sign-in, and it is the sign-in itself
# that does it, not the read that follows. GoTrue's password grant updates
# auth.users.last_sign_in_at and inserts into auth.refresh_tokens and
# auth.audit_log_entries — genuine INSERT/UPDATE traffic against Postgres,
# which is the thing that auto-pauses.
#
# The read afterwards is a health probe, not the keep-alive. It returns
# `200 []` forever and that is CORRECT: the keep-alive account owns no rows and
# owner-scoped RLS is doing its job. Do not "fix" the empty body, and do not
# give this account rows to read — it is deliberately an account that can see
# nothing (see supabase/CLAUDE.md, and §4 of supabase/schema.sql).
#
# Setup: one dedicated Supabase account, and two repository secrets holding its
# credentials. It needs no rows and no special grants — a plain signed-up user
# is enough, and owner-scoped RLS guarantees it can read nobody else's data.
#
#   Settings -> Secrets and variables -> Actions
#     KEEPALIVE_EMAIL
#     KEEPALIVE_PASSWORD
#
# The project URL and publishable key are still read out of index.html, where
# they are public by design (see CONFIG in index.html — RLS is what protects
# the data). A service-role key must never land in this repo; check-app.mjs
# fails the build if one does, and nothing here needs one.
#
# Note: GitHub disables scheduled workflows in a repository with no activity
# for 60 days, and will email before doing so. If this repo goes quiet for that
# long, re-enable it from the Actions tab.

name: keep-alive

on:
  schedule:
    - cron: '17 20 * * 1,4'   # Mon + Thu, 20:17 UTC (~08:17 NZST next morning)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: ping Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read project config from index.html
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("index.html", "utf8");
            const pick = (key) => {
              const m = new RegExp(key + ":\\s*\x27([^\x27]+)\x27").exec(src);
              if (!m) { console.error("could not find " + key + " in index.html"); process.exit(1); }
              return m[1];
            };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "url=" + pick("SUPABASE_URL") + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "key=" + pick("SUPABASE_KEY") + "\n");
          '

      - name: Sign in and touch the database
        env:
          URL: ${{ steps.config.outputs.url }}
          KEY: ${{ steps.config.outputs.key }}
          KEEPALIVE_EMAIL: ${{ secrets.KEEPALIVE_EMAIL }}
          KEEPALIVE_PASSWORD: ${{ secrets.KEEPALIVE_PASSWORD }}
        run: |
          # No `set -e`. curl's exit status is the most informative signal this
          # job has and errexit throws it away: the previous version died on
          # the bare assignment with "Process completed with exit code 6" and
          # never reached its own error messages, so two consecutive failure
          # emails said nothing about a paused project. Every call below is
          # checked explicitly instead.
          set -uo pipefail

          HOST=${URL#https://}

          fail() { echo "::error::$*"; exit 1; }

          # Sets CURL_RC / CURL_CODE / CURL_BODY. Never trips the shell.
          probe() {
            local err body
            err=$(mktemp); body=$(mktemp)
            CURL_CODE=$(curl -sS -o "$body" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 "$@" 2>"$err")
            CURL_RC=$?
            CURL_ERR=$(cat "$err"); CURL_BODY=$(cat "$body")
            rm -f "$err" "$body"
          }

          # Transport first: a paused project is a DNS failure, not a status
          # code. Supabase withdraws the hostname when it pauses, so curl never
          # gets far enough to return one.
          check_transport() {
            [ "$CURL_RC" -eq 0 ] && return 0
            case "$CURL_RC" in
              6)
                fail "$1: could not resolve $HOST. For a Supabase project this almost always means it is PAUSED — Supabase withdraws DNS when it pauses. Restore it at https://supabase.com/dashboard/project/${HOST%%.*} (curl: $CURL_ERR)"
                ;;
              7)
                fail "$1: could not connect to $HOST — the host resolves but is refusing connections. (curl: $CURL_ERR)"
                ;;
              28)
                fail "$1: timed out. Supabase may be degraded — check https://status.supabase.com. (curl: $CURL_ERR)"
                ;;
              35|51|60)
                fail "$1: TLS failure talking to $HOST. (curl: $CURL_ERR)"
                ;;
              *)
                fail "$1: curl exited $CURL_RC. (curl: $CURL_ERR)"
                ;;
            esac
          }

          # A 401 is never a pause: a paused project stops answering, it does
          # not start rejecting credentials. Saying so here stopped the first
          # real failure being taken to the wrong question once already.
          check_status() {
            local hint
            case "$CURL_CODE" in
              2[0-9][0-9]|3[0-9][0-9]) return 0 ;;
              401|403)
                # Name only the credentials the failing call actually used.
                # Sending someone to the wrong question is the failure mode
                # this whole rewrite exists to stop.
                case "$1" in
                  auth/v1/token)
                    hint="The KEEPALIVE_EMAIL / KEEPALIVE_PASSWORD secrets are wrong, or that account was deleted or never confirmed its email." ;;
                  *)
                    hint="CONFIG.SUPABASE_KEY in index.html is no longer valid or has been disabled." ;;
                esac
                fail "$1: Supabase answered $CURL_CODE — a credentials problem, NOT a paused project. $hint"
                ;;
              *)
                fail "$1: Supabase answered $CURL_CODE. $CURL_BODY"
                ;;
            esac
          }

          if [ -z "$KEEPALIVE_EMAIL" ] || [ -z "$KEEPALIVE_PASSWORD" ]; then
            fail "KEEPALIVE_EMAIL / KEEPALIVE_PASSWORD are not set. Create a dedicated Supabase account and add its credentials under Settings -> Secrets and variables -> Actions. Without them this job can only prove the project is reachable, which is what let it pause in the first place — see the comment at the top of this file."
          fi

          # 1. Liveness, before any credentials are involved. This is where a
          #    paused project is caught, with the clearest possible message.
          probe -H "apikey: $KEY" "$URL/auth/v1/health"
          check_transport "auth/v1/health"
          check_status    "auth/v1/health"
          echo "auth/v1/health    -> $CURL_CODE"

          # 2. The keep-alive proper. jq builds the body so a password
          #    containing quotes or backslashes cannot produce malformed JSON.
          body=$(jq -nc --arg email "$KEEPALIVE_EMAIL" --arg password "$KEEPALIVE_PASSWORD" \
                   '{email: $email, password: $password}')
          probe -X POST "$URL/auth/v1/token?grant_type=password" \
            -H "apikey: $KEY" -H 'Content-Type: application/json' \
            --data-binary "$body"
          check_transport "auth/v1/token"
          check_status    "auth/v1/token"

          # GitHub masks the secrets themselves, but not a token derived from
          # them. Mask it before it can reach a log line.
          token=$(printf '%s' "$CURL_BODY" | jq -r '.access_token // empty' 2>/dev/null)
          [ -n "$token" ] || fail "auth/v1/token: signed in with $CURL_CODE but the response carried no access_token."
          echo "::add-mask::$token"
          echo "auth/v1/token     -> $CURL_CODE (signed in; last_sign_in_at updated)"

          # 3. End-to-end check of the PostgREST -> Postgres path with a real
          #    session JWT, exactly as the app sends it. `200 []` is the
          #    expected answer: this account owns no rows. Only the status code
          #    is being checked.
          probe -H "apikey: $KEY" -H "Authorization: Bearer $token" \
            "$URL/rest/v1/properties?select=id&limit=1"
          check_transport "rest/v1/properties"
          check_status    "rest/v1/properties"
          echo "rest/v1/properties -> $CURL_CODE (empty body expected — RLS)"

          # 4. Hand the refresh token back rather than leaving a row behind on
          #    every run. Best-effort: the keep-alive has already happened by
          #    this point, so a failure here is not worth failing the job over.
          probe -X POST "$URL/auth/v1/logout" \
            -H "apikey: $KEY" -H "Authorization: Bearer $token"
          echo "auth/v1/logout    -> ${CURL_CODE:-skipped}"
