# Keeps the Supabase project awake.
#
# Projects on the Free plan pause after 7 consecutive days of inactivity. A
# property manager who opens the app weekly is exactly that usage pattern, and
# a paused project fails every sync with no indication of why. It is restorable
# within 90 days, but the downtime arrives unannounced.
#
# This sends a trivial REST request twice a week. No secrets are involved: the
# URL and publishable key are read out of index.html, where they are already
# public by design (see CONFIG in index.html — the publishable key is meant to
# be in the served file; RLS is what protects the data).
#
# Note: GitHub disables scheduled workflows in a repository with no activity
# for 60 days, and will email before doing so. If this repo goes quiet for that
# long, re-enable it from the Actions tab.

name: keep-alive

on:
  schedule:
    - cron: '17 20 * * 1,4'   # Mon + Thu, 20:17 UTC (~08:17 NZST next morning)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: ping Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read project config from index.html
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("index.html", "utf8");
            const pick = (key) => {
              const m = new RegExp(key + ":\\s*\x27([^\x27]+)\x27").exec(src);
              if (!m) { console.error("could not find " + key + " in index.html"); process.exit(1); }
              return m[1];
            };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "url=" + pick("SUPABASE_URL") + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "key=" + pick("SUPABASE_KEY") + "\n");
          '

      - name: Ping REST and auth
        run: |
          set -euo pipefail
          URL='${{ steps.config.outputs.url }}'
          KEY='${{ steps.config.outputs.key }}'

          # `apikey` ONLY — no Authorization header.
          #
          # CONFIG.SUPABASE_KEY is a modern publishable key (sb_publishable_…),
          # and those are not JWTs. Supabase documents the exact failure this
          # job hit on its first ever run: sending the key as
          # `Authorization: Bearer sb_publishable_…` is forwarded when it
          # matches the apikey header, and then "rejected as the value is not
          # a JWT" — a 401 from PostgREST that looks identical to a paused
          # project. The legacy anon key was a JWT, which is why the
          # Bearer-and-apikey pattern is still everywhere in older examples.
          #
          # The app itself is unaffected: authHeader() sends a real session
          # JWT in Authorization, not this key.
          #
          # /auth/v1/health needs the apikey header too. It was previously
          # called with no headers at all, so it returned 401 every time.
          rest=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/rest/v1/")
          auth=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/auth/v1/health")

          echo "rest/v1/       -> $rest"
          echo "auth/v1/health -> $auth"

          # Require an explicit 2xx/3xx rather than testing for "not >= 400":
          # a connection that never completes reports 000, and `[ 000 -ge 400 ]`
          # is false, so the negative test would have passed the very outage
          # this job exists to detect. (set -e already catches a non-zero curl
          # exit; this covers the case where curl exits 0 with no response.)
          # Say which failure this is. "The project may be paused" was the only
          # message this job could produce, and it sent the first real failure
          # straight to the wrong question — the project was ACTIVE_HEALTHY and
          # the request was malformed. A 401 is never a pause: a paused project
          # stops answering, it does not start rejecting credentials.
          for code in "$rest" "$auth"; do
            case "$code" in
              2[0-9][0-9]|3[0-9][0-9]) ;;
              401|403)
                echo "::error::Supabase answered $code — this is a credentials problem, NOT a paused project. Check the apikey header and that CONFIG.SUPABASE_KEY in index.html is still valid and enabled."
                exit 1
                ;;
              000)
                echo "::error::No response at all — DNS, TLS or a network failure reaching $URL."
                exit 1
                ;;
              *)
                echo "::error::Supabase answered $code — the project may be paused. Check the dashboard."
                exit 1
                ;;
            esac
          done
